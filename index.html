  <!DOCTYPE html>
  <html>
  <head>
  <meta charset="utf-8">
  <title>Editor</title>
  <style>
  html, body { margin: 0; padding: 0; height: 100%; }
  body { box-sizing: border-box; }
  iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
  </head>
  <body>
  <iframe id="inner" sandbox="allow-same-origin"
    srcdoc='<!DOCTYPE html>
  <html>
  <head><meta charset="utf-8"></head>
  <body contenteditable="true"
        style="margin:0;padding:12px;min-height:100vh;box-sizing:border-box;font-family:system-ui,sans-serif;">
  </body>
  </html>'></iframe>

  <script>
  (function() {
    var inner = document.getElementById("inner");
    var loaded = false;
    var pendingInit = null;

    inner.addEventListener("load", function() {
      loaded = true;
      if (pendingInit !== null) {
        writeContent(pendingInit);
        pendingInit = null;
      }
      if (window.parent !== window) {
        window.parent.postMessage({ type: "editor-ready" }, "*");
      }
    });

    function writeContent(html) {
      try {
        inner.contentDocument.body.innerHTML = html || "";
        return true;
      } catch (e) {
        return false;
      }
    }

    function readContent() {
      try {
        return inner.contentDocument.body.innerHTML;
      } catch (e) {
        return null;
      }
    }

    window.addEventListener("message", function(e) {
      var msg = e.data;
      if (!msg || typeof msg !== "object") return;

      if (msg.type === "set-content") {
        if (!loaded) {
          pendingInit = msg.html;
          return;
        }
        var ok = writeContent(msg.html || "");
        if (e.source) e.source.postMessage({ type: "content-set", ok: ok }, e.origin);
      } else if (msg.type === "get-content") {
        var html = readContent();
        if (e.source) e.source.postMessage({ type: "content", html: html }, e.origin);
      }
    });
  })();
  </script>
  </body>
  </html>
